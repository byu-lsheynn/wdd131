<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W02 Learning Activity: Document Object Model</title>
    <meta name="description" content="This app allows users to enter their favorite Book of Mormon chapters 
        and display them in a list that updates automatically on the screen. 
        Entries can then be deleted from the list.">
    <meta name="author" content="Lady Sheynn Vengco">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    
    <link rel="stylesheet" href="styles/bom.css">
    <script src="scripts/bom.js" defer></script>
</head>
<body>
    <h1>📖 Book of Mormon - Top 10</h1>
    <main>
        <label for="favchap">Enter Book and Chapter: </label>
        <input type="text" id="favchap" placeholder="Alma 5">
        <button type="submit">Add Chapter</button>
        <ul id="list"></ul>
    </main>
</body>
</html>
