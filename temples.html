<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W02 Assignment: Picture Album</title>
    <meta name="description" content="A web development assignment applying responsive design principles 
        to create a picture album page with a hamburger menu and user interactions.">
    <meta name="author" content="Lady Sheynn Vengco">

    <!-- External Source -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montenegrin+Gothic+One&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <div class="page-title">Temple Album</div>
        <div class="navbar">

            <!-- Hamburger / Close Toggle Button -->
            <div class="hamburger-btn" id="hamburger-btn">
                <span></span>
            </div>

            <!-- Navigation Links -->
            <nav id="menu-nav">
                <a href="#home" class="active">Home</a>
                <a href="#old">Old</a>
                <a href="#new">New</a>
                <a href="#large">Large</a>
                <a href="#small">Small</a>
            </nav>
        </div>
    </header>

    <main>
        <h1>Home</h1>
        <div class="gallery-container">
            <!-- Temple 1 -->
            <figure>
                <img src="images/manila-philippines-temple.jpg" alt="Manila Philippines Temple" width="200">
                <figcaption>Manila Philippines Temple</figcaption>
            </figure>
            <!-- Temple 2 -->
            <figure>
                <img src="images/cebu-city-ph-temple.jpg" alt="Cebu City Philippines Temple">
                <figcaption>Cebu City Philippines Temple</figcaption>
            </figure>
            <!-- Temple 3 -->
            <figure>
                <img src="images/urdaneta-ph-temple.jpg" alt="Urdaneta Philippines Temple">
                <figcaption>Urdaneta Philippines Temple</figcaption>
            </figure>
            <!-- Temple 4 -->
            <figure>
                <img src="images/alabang-philippines-temple.jpg" alt="Alabang Philippines Temple">
                <figcaption>Alabang Philippines Temple</figcaption>
            </figure>
            <!-- Temple 5 -->
            <figure>
                <img src="images/davao-philippines-temple.jpg" alt="Davao Philippines Temple">
                <figcaption>Davao Philippiens Temple</figcaption>
            </figure>
            <!-- Temple 6 -->
            <figure>
                <img src="images/bacolod-philippines-temple.jpg" alt="Bacolod Philippines Temple">
                <figcaption>Bacolod Philippiens Temple</figcaption>
            </figure>
            <!-- Temple 7 -->
            <figure>
                <img src="images/cagayan-de-oro-ph-temple.jpg" alt="Cagayan de Oro Philippines Temple">
                <figcaption>Cagayan de Oro Philippines Temple</figcaption>
            </figure>
            <!-- Temple 8 -->
            <figure>
                <img src="images/tacloban-city-ph-temple.jpg" alt="Tacloban City Philippines Temple">
                <figcaption>Tacloban City Philippines Temple</figcaption>
            </figure>
            <!-- Temple 9 -->
            <figure>
                <img src="images/naga-philippines-temple.jpg" alt="Naga Philippines Temple">
                <figcaption>Naga Philippines Temple</figcaption>
            </figure>
        </div>
    </main>
    
    <footer>
        <p>&copy;<span id="currentyear"></span> | Lady Sheynn Vengco | Philippines</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
