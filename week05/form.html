<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W05 Assignment: Product Review Form</title>
    <meta name="description" content="This is product review form page assignment.">
    <meta name="author" content="Lady Sheynn Vengco">

    <!-- External Links -->
    <script src="scripts/from.js" defer></script>
    <link rel="stylesheet" href="styles/form.css">

    <!-- Google Fonts -->
    <link rel="stylesheet" href="styles/base.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <body>
        <form action="review.html" method="get">
        
            <!-- Product Name -->
            <div class="form-group">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>
        
            <!-- Overall Rating -->
            <div class="form-group">
                <label>Overall Rating</label>
                <div class="rating-group">
                    <label for="rating1"><input type="radio" id="rating1" name="rating" value="1" required> 1 ☆</label>
                    <label for="rating2"><input type="radio" id="rating2" name="rating" value="2" required> 2 ☆</label>
                    <label for="rating3"><input type="radio" id="rating3" name="rating" value="3" required> 3 ☆</label>
                    <label for="rating4"><input type="radio" id="rating4" name="rating" value="4" required> 4 ☆</label>
                    <label for="rating5"><input type="radio" id="rating5" name="rating" value="5" required> 5 ☆</label>
                </div>
            </div>
        
            <!-- Date of Installation -->
            <div class="form-group">
                <label for="installed">Date of Installation</label>
                <input type="date" id="installed" name="installed" required>
            </div>
        
            <!-- Useful Features -->
            <div class="form-group">
                <label>Useful Features (Check all that apply)</label>
                <div class="checkbox-group">
                    <label for="feature1">
                        <input type="checkbox" id="feature1" name="features" value="durability"> Durability
                    </label>
                    <label for="feature2">
                        <input type="checkbox" id="feature2" name="features" value="ease_of_use"> Ease of Use
                    </label>
                    <label for="feature3">
                        <input type="checkbox" id="feature3" name="features" value="performance"> Performance
                    </label>
                    <label for="feature4">
                        <input type="checkbox" id="feature4" name="features" value="design"> Design
                    </label>
                </div>
            </div>
        
            <!-- Written Review -->
            <div class="form-group">
                <label for="review">Written Review</label>
                <textarea id="review" name="review"></textarea>
            </div>
        
            <!-- User Name -->
            <div class="form-group">
                <label for="username">User Name</label>
                <input type="text" id="username" name="username">
            </div>
        
            <!-- Submission Button -->
            <div class="form-group">
                <input type="submit" value="Post Review">
            </div>
        
        </form>
    </body>

    <footer>
        <p>&copy;<span id="currentyear"></span> | Lady Sheynn Vengco | Philippines</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
